servicio: auth

acciones:
  - nombre: usuarios.ver
    descripcion: Ver listado y detalle de usuarios
    activo: true
  - nombre: usuarios.crear
    descripcion: Crear usuarios nuevos
    activo: true
  - nombre: usuarios.editar
    descripcion: Editar usuarios existentes
    activo: true
  - nombre: usuarios.eliminar
    descripcion: Eliminar usuarios
    activo: true
  - nombre: roles.asignar
    descripcion: Asignar o revocar roles de un usuario
    activo: true
  - nombre: roles.ver
    descripcion: Ver un rol o lista de roles
    activo: true
  - nombre: roles.control_parcial
    descripcion: Crear o editar roles y las acciones que tienen vinculadas
    activo: true
  - nombre: roles.eliminar
    descripcion: Eliminar un rol
    activo: true
  - nombre: credenciales.temporal
    descripcion: Generar una contraseña temporal para cualquier usuario
    activo: true
  - nombre: documentos_legales.control_parcial
    descripcion: Publicar y listar documentos legales
    activo: true

roles:
  - nombre: administrador roles
    descripcion: Administra la asignación de roles y acciones de usuarios

rol_accion:
  - rol: ADMINISTRADOR
    acciones:
      - usuarios.ver
      - usuarios.crear
      - usuarios.editar
      - usuarios.eliminar
      - roles.asignar
      - roles.ver
      - roles.control_parcial
      - roles.eliminar
      - credenciales.temporal
      - documentos_legales.control_parcial
  - rol: GESTIÓN ACADÉMICA
    acciones:
      - usuarios.ver
      - usuarios.crear
      - usuarios.editar
  - rol: DOCENTE
    acciones:
      - usuarios.ver
  - rol: AUDITOR
    acciones:
      - usuarios.ver
  - rol: administrador roles
    acciones:
      - usuarios.ver
      - roles.asignar
      - roles.ver
      - roles.control_parcial
      - roles.eliminar